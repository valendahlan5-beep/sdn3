/* Premium Design System */
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --primary-light: #6366f1;
  --primary-50: #eef2ff;
  --accent: #f59e0b;
  --accent-dark: #d97706;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #06b6d4;
  --purple: #8b5cf6;
  --pink: #ec4899;
  --bg: #f5f7fb;
  --bg-soft: #eef2f7;
  --card: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e5e7eb;
  --sidebar: #0b1020;
  --sidebar-2: #111827;
  --sidebar-text: #cbd5e1;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 18px;
  --shadow: 0 6px 20px rgba(15,23,42,.06);
  --shadow-lg: 0 20px 45px rgba(15,23,42,.12);
  --shadow-xl: 0 30px 60px rgba(15,23,42,.18);
  --glass: rgba(255,255,255,.7);
  --gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
  --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
}
[data-theme="dark"] {
  --bg: #0b1020;
  --bg-soft: #111827;
  --card: #151b2e;
  --text: #e5e7eb;
  --text-muted: #94a3b8;
  --border: #263047;
  --sidebar: #050816;
  --sidebar-2: #0b1020;
  --shadow: 0 6px 20px rgba(0,0,0,.3);
  --glass: rgba(21,27,46,.7);
  --gradient-soft: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; transition: background .3s, color .3s; }
a { color: var(--primary); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
h1,h2,h3,h4 { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }

/* Animations */
@keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
@keyframes slideIn { from { opacity:0; transform: translateX(-12px);} to { opacity:1; transform: translateX(0);} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.fade-in { animation: fadeIn .35s ease; }

/* App shell */
.app-shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 270px; background: linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%); color: var(--sidebar-text); display: flex; flex-direction: column; flex-shrink: 0; transition: transform .3s; z-index: 50; border-right: 1px solid rgba(255,255,255,.05); }
.sidebar-brand { padding: 22px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
.sidebar-brand .logo { width: 46px; height: 46px; border-radius: 12px; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(79,70,229,.4); }
.sidebar-brand h1 { font-size: 14px; color: #fff; font-weight: 700; line-height: 1.2; }
.sidebar-brand p { font-size: 11px; color: var(--sidebar-text); margin-top: 2px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
.nav-group { margin-bottom: 10px; }
.nav-group-title { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; padding: 10px 12px 4px; font-weight: 700; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--sidebar-text); cursor: pointer; font-size: 13.5px; font-weight: 500; transition: all .2s; position: relative; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; transform: translateX(2px); }
.nav-item.active { background: var(--gradient); color: #fff; box-shadow: 0 8px 20px rgba(79,70,229,.35); }
.nav-item .icon { width: 20px; text-align: center; font-size: 15px; }
.nav-item .badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 999px; }
.sidebar-footer { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.06); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); }
.user-chip .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; }
.user-chip .name { color: #fff; font-size: 13px; font-weight: 600; }
.user-chip .role { font-size: 11px; color: var(--sidebar-text); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; backdrop-filter: blur(10px); }
.topbar h2 { font-size: 19px; font-weight: 800; color: var(--text); }
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.topbar .search { position: relative; }
.topbar .search input { padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-soft); width: 240px; transition: all .2s; }
.topbar .search input:focus { outline: none; border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px rgba(79,70,229,.15); width: 300px; }
.topbar .search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--bg-soft); color: var(--text); display: flex; align-items: center; justify-content: center; transition: all .2s; font-size: 16px; }
.icon-btn:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: all .2s; position: relative; overflow: hidden; }
.btn-primary { background: var(--gradient); color: #fff; box-shadow: 0 8px 20px rgba(79,70,229,.3); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(79,70,229,.4); }
.btn-secondary { background: var(--bg-soft); color: var(--text); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-ghost { background: transparent; color: var(--text); }
.btn-ghost:hover { background: var(--bg-soft); }
.btn-sm { padding: 6px 11px; font-size: 12px; }
.btn-icon { padding: 6px 8px; }
.btn:active { transform: translateY(0); }

.content { flex: 1; overflow-y: auto; padding: 22px; }
.container { max-width: 1320px; margin: 0 auto; }

/* Cards */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; border: 1px solid var(--border); transition: all .2s; animation: fadeIn .4s ease; }
.card:hover { box-shadow: var(--shadow-lg); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.card-title { font-size: 16px; font-weight: 700; color: var(--text); }
.card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.card-glass { background: var(--glass); backdrop-filter: blur(12px); }

/* Grid */
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1100px) { .grid-4,.grid-5 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .grid-2,.grid-3,.grid-4,.grid-5 { grid-template-columns: 1fr; } }

/* Stat cards */
.stat-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); transition: all .2s; position: relative; overflow: hidden; }
.stat-card::before { content:''; position: absolute; top:0; left:0; right:0; height: 3px; background: var(--gradient); opacity: 0; transition: opacity .2s; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-card:hover::before { opacity: 1; }
.stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; flex-shrink: 0; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Tables */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { background: var(--bg-soft); font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
tr:hover td { background: var(--bg-soft); }
tbody tr { transition: background .15s; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge-success { background: #d1fae5; color: #065f46; }
.badge-danger { background: #fee2e2; color: #991b1b; }
.badge-warning { background: #fef3c7; color: #92400e; }
.badge-info { background: #cffafe; color: #155e75; }
.badge-primary { background: #dbeafe; color: #1e40af; }
.badge-purple { background: #ede9fe; color: #5b21b6; }
[data-theme="dark"] .badge-success { background: #064e3b; color: #6ee7b7; }
[data-theme="dark"] .badge-danger { background: #7f1d1d; color: #fca5a5; }
[data-theme="dark"] .badge-warning { background: #78350f; color: #fcd34d; }
[data-theme="dark"] .badge-info { background: #164e63; color: #67e8f9; }
[data-theme="dark"] .badge-primary { background: #1e3a8a; color: #93c5fd; }

/* Forms */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-control { width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); transition: all .2s; }
.form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
textarea.form-control { min-height: 100px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
.input-with-icon { position: relative; }
.input-with-icon .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.input-with-icon input { padding-left: 38px; }

/* Modals */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; animation: fadeIn .2s; }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); border: 1px solid var(--border); }
.modal-header { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 17px; font-weight: 700; }
.modal-body { padding: 22px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.close-btn { background: none; font-size: 22px; color: var(--text-muted); padding: 0 6px; border-radius: 8px; }
.close-btn:hover { background: var(--bg-soft); }

/* Login */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gradient); padding: 20px; position: relative; overflow: hidden; }
.login-screen::before { content:''; position: absolute; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,255,255,.1); top: -100px; right: -100px; }
.login-screen::after { content:''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,.08); bottom: -80px; left: -80px; }
.login-card { background: var(--card); border-radius: 22px; padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); position: relative; z-index: 1; }
.login-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 22px; }
.login-logo { width: 68px; height: 68px; border-radius: 16px; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 24px; margin-bottom: 16px; box-shadow: 0 12px 30px rgba(79,70,229,.4); }
.demo-accounts { margin-top: 18px; padding: 14px; background: var(--bg-soft); border-radius: 12px; font-size: 12px; color: var(--text-muted); }
.demo-accounts strong { color: var(--text); }
.demo-accounts div { margin-top: 4px; }

/* Empty */
.empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.empty .icon { font-size: 48px; margin-bottom: 10px; }
.empty h4 { color: var(--text); margin-bottom: 4px; }

/* Profile */
.profile-header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.profile-avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 30px; box-shadow: 0 12px 30px rgba(79,70,229,.3); }
.info-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-item { padding: 12px 14px; background: var(--bg-soft); border-radius: 10px; border: 1px solid var(--border); }
.info-item .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.info-item .value { font-size: 14px; font-weight: 600; margin-top: 3px; }
@media (max-width: 640px) { .info-list { grid-template-columns: 1fr; } }

/* Calendar */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-day { padding: 8px; border-radius: 10px; background: var(--bg-soft); min-height: 64px; font-size: 12px; border: 1px solid var(--border); }
.cal-day .num { font-weight: 700; }
.cal-day.has-event { background: var(--primary-50); border-color: var(--primary-light); }
.cal-day.today { background: var(--gradient); color: #fff; }
.cal-header { text-align: center; font-weight: 700; font-size: 12px; color: var(--text-muted); padding: 6px; }

/* Chat */
.chat-box { border: 1px solid var(--border); border-radius: 14px; height: 420px; display: flex; flex-direction: column; background: var(--card); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; animation: fadeIn .2s; }
.chat-msg.mine { align-self: flex-end; background: var(--gradient); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.theirs { align-self: flex-start; background: var(--bg-soft); border-bottom-left-radius: 4px; }
.chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }

/* Mobile */
.toggle-sidebar { display: none; }
@media (max-width: 768px) {

  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-xl); }
  .toggle-sidebar { display: inline-flex; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; backdrop-filter: blur(2px); }
  .topbar .search input { width: 140px; }
}
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--bg); padding: 13px 18px; border-radius: 12px; box-shadow: var(--shadow-xl); z-index: 200; font-size: 13px; animation: slideIn .3s; border: 1px solid var(--border); }
[data-theme="dark"] .toast { background: var(--card); color: var(--text); }

/* Landing page */
.landing { min-height: 100vh; background: var(--bg); }
.landing-nav { position: sticky; top: 0; z-index: 10; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
.landing-hero { padding: 70px 24px; text-align: center; background: var(--gradient-soft); position: relative; overflow: hidden; }
.landing-hero h1 { font-size: 46px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.15; }
.landing-hero p { color: var(--text-muted); font-size: 17px; max-width: 640px; margin: 16px auto 28px; }
.landing-section { padding: 60px 24px; max-width: 1200px; margin: 0 auto; }
.landing-section h2 { font-size: 30px; font-weight: 800; text-align: center; margin-bottom: 10px; }
.landing-section .sub { text-align: center; color: var(--text-muted); margin-bottom: 36px; }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 900px) { .feature-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 600px) { .feature-grid { grid-template-columns: 1fr; } .landing-hero h1 { font-size: 32px; } }
.feature-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; transition: all .2s; }
.feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.feature-card .icon { width: 48px; height: 48px; border-radius: 12px; background: var(--gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
.feature-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.feature-card p { color: var(--text-muted); font-size: 13px; }

/* Print */
.print-area { background: #fff; }
@media print { .sidebar, .topbar, .no-print { display: none !important; } .content { padding: 0; } body { background: #fff; } }

/* Misc */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--bg-soft); font-size: 12px; font-weight: 500; }
.progress { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--gradient); border-radius: 999px; transition: width .6s; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
.kpi-row { display: flex; gap: 12px; flex-wrap: wrap; }
.kpi { flex: 1; min-width: 120px; padding: 14px; background: var(--bg-soft); border-radius: 12px; text-align: center; }
.kpi .v { font-size: 22px; font-weight: 800; color: var(--text); }
.kpi .l { font-size: 11px; color: var(--text-muted); }

</style>

async function init(){
  if(darkMode){ document.documentElement.setAttribute('data-theme','dark'); }
  const token = localStorage.getItem('sp_token');
  const API = window.API_BASE || 'http://localhost:3000';
  if(token){
    try {
      const r = await fetch(API+'/api/health');
      if(r.ok){
        window.__apiMode = true; window.API_BASE = API;
        const cols = ['users','classes','subjects','schedule','exams','attendance','grades','assignments','submissions','materials','extracurriculars','library','loans','payments','ppdb','announcements','messages','events','gallery','notifications'];
        const cache = {};
        for(const c of cols){ try { const rr = await fetch(API+'/api/'+c, { headers:{'Authorization':'Bearer '+token} }); if(rr.ok) cache[c] = await rr.json(); } catch(e){} }
        try { const rr = await fetch(API+'/api/school'); if(rr.ok) cache.school = await rr.json(); } catch(e){}
        window.__cache = cache;
        const u = (cache.users||[]).find(x=>x.id===localStorage.getItem(SESSION_KEY));
        if(u){ currentUser = u; currentPage='dashboard'; }
      }
    } catch(e){ window.__apiMode = false; }
  }
  if(!window.__apiMode){
    const sid = localStorage.getItem(SESSION_KEY);
    if(sid){ const u = findUser(sid); if(u){ currentUser = u; currentPage = 'dashboard'; } }
  }
  window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); window._installPrompt = e; renderApp(); });
  renderApp();
}

function toast(msg, type='info'){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
}
function setSession(uid){ localStorage.setItem(SESSION_KEY, uid); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function logout(){ currentUser=null; clearSession(); localStorage.removeItem('sp_token'); window.__apiMode=false; window.__cache={}; currentPage='landing'; renderApp(); }
async function login(username, password){
  const API = window.API_BASE || 'http://localhost:3000';
  // try backend first
  try {
    const r = await fetch(API+'/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password}) });
    if(r.ok){
      const data = await r.json();
      localStorage.setItem('sp_token', data.token);
      window.__apiMode = true;
      window.API_BASE = API;
      // load all collections
      const cols = ['users','classes','subjects','schedule','exams','attendance','grades','assignments','submissions','materials','extracurriculars','library','loans','payments','ppdb','announcements','messages','events','gallery','notifications'];
      const cache = {};
      for(const c of cols){ try { const rr = await fetch(API+'/api/'+c, { headers:{'Authorization':'Bearer '+data.token} }); if(rr.ok) cache[c] = await rr.json(); } catch(e){} }
      try { const rr = await fetch(API+'/api/school'); if(rr.ok) cache.school = await rr.json(); } catch(e){}
      window.__cache = cache;
      currentUser = data.user; setSession(data.user.id); currentPage='dashboard'; renderApp(); toast('Selamat datang, '+data.user.name); return true;
    }
  } catch(e){ console.warn('backend unavailable, using local', e); }
  // fallback local
  const u = db('users').find(x=>x.username===username && x.password===password);
  if(!u){ toast('Username atau password salah','danger'); return false; }
  currentUser = u; setSession(u.id); currentPage='dashboard'; renderApp(); toast('Selamat datang, '+u.name); return true;
}

/* ---------- Shell ---------- */
function renderShell(){

    const badge = it.key==='notifications' ? (unreadNotifCount(currentUser.id)?`<span class="badge">${unreadNotifCount(currentUser.id)}</span>`:'') : '';
    navHtml += `<div class="nav-item ${currentPage===it.key?'active':''}" data-page="${it.key}"><span class="icon">${it.icon}</span>${it.label}${badge}</div>`;

  return `

    <aside class="sidebar ${sidebarOpen?'open':''}" id="sidebar">

function bindShell(){
  document.querySelectorAll('.nav-item').forEach(el=> el.addEventListener('click', ()=>{ currentPage = el.dataset.page; sidebarOpen=false; renderApp(); }));
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  const ts = document.getElementById('toggleSidebar');
  if(ts) ts.addEventListener('click', ()=>{ sidebarOpen=!sidebarOpen; renderApp(); });
  const ov = document.getElementById('overlay');
  if(ov) ov.addEventListener('click', ()=>{ sidebarOpen=false; renderApp(); });
  const gs = document.getElementById('globalSearch');
  if(gs){ gs.addEventListener('input', e=>{ searchQuery = e.target.value; }); gs.addEventListener('keydown', e=>{ if(e.key==='Enter'){ currentPage='search'; renderApp(); } }); }

function renderAnnouncementList(n){
  const anns = db('announcements').sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || new Date(b.createdAt)-new Date(a.createdAt)).slice(0,n);
  if(!anns.length) return '<div class="empty"><div class="icon">📢</div>Belum ada pengumuman</div>';
  return anns.map(a=>`
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${a.pinned?'<span class="badge badge-warning">📌 Pinned</span>':''}
        <span class="badge badge-primary">${audienceLabel(a.audience)}</span>
        <strong style="font-size:13.5px;">${a.title}</strong>
      </div>
      <p style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">${a.content}</p>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${fmtDate(a.createdAt)} • ${userName(a.authorId)}</div>
    </div>`).join('');
}
function renderTodaySchedule(teacherId){
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const todayName = days[new Date().getDay()];
  const sch = db('schedule').filter(s=>s.teacherId===teacherId && s.day===todayName);
  if(!sch.length) return '<div class="empty">Tidak ada jadwal hari ini</div>';
  return sch.map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;"><span><strong>${s.time}</strong> • ${subjectName(s.subjectId)}</span><span style="color:var(--text-muted);font-size:12px;">${className(s.classId)}</span></div>`).join('');
}
function renderTodayScheduleForClass(classId){
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const todayName = days[new Date().getDay()];
  const sch = db('schedule').filter(s=>s.classId===classId && s.day===todayName).sort((a,b)=>a.time.localeCompare(b.time));
  if(!sch.length) return '<div class="empty">Tidak ada jadwal hari ini</div>';
  return sch.map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;"><span><strong>${s.time}</strong> • ${subjectName(s.subjectId)}</span><span style="color:var(--text-muted);font-size:12px;">${userName(s.teacherId)}</span></div>`).join('');
}
function renderUpcomingEvents(){
  const evs = db('events').filter(e=>new Date(e.date)>=new Date(new Date().toDateString())).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);
  if(!evs.length) return '<div class="empty">Tidak ada acara mendatang</div>';
  return evs.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;"><span><strong>${e.title}</strong><br><span style="font-size:12px;color:var(--text-muted);">${e.description||''}</span></span><span class="badge badge-info">${fmtDate(e.date)}</span></div>`).join('');
}
function renderActivityList(){
  const items = [
    ...db('assignments').slice(0,3).map(a=>`📝 Tugas baru: ${a.title}`),
    ...db('announcements').slice(0,2).map(a=>`📢 ${a.title}`),
  ];
  if(!items.length) return '<div class="empty">Belum ada aktivitas</div>';
  return items.map(i=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">${i}</div>`).join('');
}

/* ---------- Schedule ---------- */
function pageSchedule(){
  const canManage = currentUser.role!=='murid' && currentUser.role!=='ortu';
  let classes = [];
  if(currentUser.role==='guru') classes = db('classes').filter(c=>c.teacherId===currentUser.id);
  else if(currentUser.role==='murid') classes = db('classes').filter(c=>c.id===currentUser.classId);
  else classes = db('classes');
  const filterClass = window._schedClass || (classes[0]?.id);
  window._schedClass = filterClass;
  const sch = db('schedule').filter(s=>s.classId===filterClass).sort((a,b)=> (['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'].indexOf(a.day)-['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'].indexOf(b.day)) || a.time.localeCompare(b.time));
  const rows = sch.map(s=>`
    <tr><td>${s.day}</td><td>${s.time}</td><td>${subjectName(s.subjectId)}</td><td>${userName(s.teacherId)}</td>
    ${canManage?`<td><button class="btn btn-danger btn-sm" data-del-sch="${s.id}">Hapus</button></td>`:'<td></td>'}</tr>`).join('') || '<tr><td colspan="5" class="empty">Belum ada jadwal</td></tr>';
  const classOpts = classes.map(c=>`<option value="${c.id}" ${c.id===filterClass?'selected':''}>${c.name}</option>`).join('');
  return `
  <div class="container fade-in">
    <div class="card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:8px;"><label>Kelas:</label><select class="form-control" id="schedClassFilter" style="width:auto;">${classOpts}</select></div>
        ${canManage?`<button class="btn btn-primary btn-sm" id="btnAddSch">+ Jadwal</button>`:''}
      </div>
      <div class="table-wrap"><table><thead><tr><th>Hari</th><th>Waktu</th><th>Mata Pelajaran</th><th>Guru</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
  </div>`;
}
function bindSchedule(){
  const f=document.getElementById('schedClassFilter');
  if(f) f.addEventListener('change', e=>{ window._schedClass=e.target.value; renderPage(); });
  const btn=document.getElementById('btnAddSch');
  if(btn) btn.addEventListener('click', openSchModal);
  document.querySelectorAll('[data-del-sch]').forEach(b=>b.addEventListener('click', ()=>{ dbSet('schedule', db('schedule').filter(x=>x.id!==b.dataset.delSch)); renderPage(); toast('Dihapus'); }));
}
function openSchModal(){
  const classes = currentUser.role==='admin'? db('classes') : db('classes').filter(c=>c.teacherId===currentUser.id);

    <div class="form-row">
      <div class="form-group"><label>Mulai</label><input class="form-control" id="schStart" type="time" value="07:00" /></div>
      <div class="form-group"><label>Selesai</label><input class="form-control" id="schEnd" type="time" value="08:30" /></div>

  `, ()=>{

/* ---------- Attendance ---------- */
function pageAttendance(){
  if(currentUser.role==='murid') return pageMuridAttendance();
  const myClasses = currentUser.role==='admin'? db('classes') : db('classes').filter(c=>c.teacherId===currentUser.id);
  const filterClass = window._attClass || (myClasses[0]?.id);
  window._attClass = filterClass;
  const filterDate = window._attDate || today();

  const classOpts = myClasses.map(c=>`<option value="${c.id}" ${c.id===filterClass?'selected':''}>${c.name}</option>`).join('');

        <option value="Sakit" ${status==='Sakit'?'selected':''}>Sakit</option>
        <option value="Izin" ${status==='Izin'?'selected':''}>Izin</option>
        <option value="Alpha" ${status==='Alpha'?'selected':''}>Alpha</option>
      </select></td>
      <td><input class="form-control" data-att-note="${s.id}" value="${rec?rec.note:''}" placeholder="Catatan" /></td></tr>`;

  return `
  <div class="container fade-in">
    <div class="card">
      <div class="card-header">

          <label>Tanggal:</label><input class="form-control" type="date" id="attDateFilter" value="${filterDate}" style="width:auto;" />
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-success btn-sm" id="btnSaveAtt">Simpan Absensi</button>
          <button class="btn btn-secondary btn-sm" onclick="exportCSV('attendance')">⬇ CSV</button>
        </div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="card"><div class="card-header"><div class="card-title">Riwayat Absensi</div></div>${renderAttendanceHistory(filterClass)}</div>
  </div>`;
}
function pageMuridAttendance(){
  const u=currentUser;
  const recs = db('attendance').filter(a=>a.studentId===u.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const hadir = recs.filter(r=>r.status==='Hadir').length;
  const pct = recs.length? Math.round(hadir/recs.length*100):0;
  const rows = recs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td><span class="badge ${r.status==='Hadir'?'badge-success':r.status==='Alpha'?'badge-danger':'badge-warning'}">${r.status}</span></td><td>${r.note||'-'}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Belum ada data</td></tr>';
  return `
  <div class="container fade-in">
    <div class="grid grid-3">
      <div class="stat-card"><div class="stat-icon" style="background:#10b981;">✅</div><div><div class="stat-value">${hadir}</div><div class="stat-label">Hadir</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f59e0b;">🤒</div><div><div class="stat-value">${recs.filter(r=>r.status==='Sakit').length}</div><div class="stat-label">Sakit</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ef4444;">❌</div><div><div class="stat-value">${recs.filter(r=>r.status==='Alpha').length}</div><div class="stat-label">Alpha</div></div></div>
    </div>
    <div class="card" style="margin-top:18px;"><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><p style="font-size:12px;color:var(--text-muted);margin-top:6px;">Kehadiran: ${pct}%</p></div>
    <div class="card" style="margin-top:18px;"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  </div>`;
}
function renderAttendanceHistory(classId){
  const recs = db('attendance').filter(a=>a.classId===classId).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
  const rows = recs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${userName(r.studentId)}</td><td><span class="badge ${r.status==='Hadir'?'badge-success':r.status==='Alpha'?'badge-danger':'badge-warning'}">${r.status}</span></td><td>${r.note||'-'}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Belum ada data</td></tr>';
  return `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Siswa</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function bindAttendance(){
  const cf=document.getElementById('attClassFilter');
  if(cf) cf.addEventListener('change', e=>{ window._attClass=e.target.value; renderPage(); });
  const df=document.getElementById('attDateFilter');
  if(df) df.addEventListener('change', e=>{ window._attDate=e.target.value; renderPage(); });
  const btn=document.getElementById('btnSaveAtt');
  if(btn) btn.addEventListener('click', saveAttendance);
}
function saveAttendance(){
  const classId = window._attClass;
  const date = window._attDate;
  const atts = db('attendance');
  document.querySelectorAll('[data-att-student]').forEach(sel=>{
    const sid = sel.dataset.attStudent;
    const status = sel.value;
    const note = document.querySelector(`[data-att-note="${sid}"]`).value.trim();
    if(!status) return;
    const idx = atts.findIndex(a=>a.studentId===sid && a.date===date);
    const rec = {id: idx>=0?atts[idx].id:uid('att'), studentId:sid, classId, date, status, note};
    if(idx>=0) atts[idx]=rec; else atts.push(rec);
  });
  dbSet('attendance', atts);
  toast('Absensi disimpan'); renderPage();
}

/* ---------- Grades ---------- */
function pageGrades(){
  if(currentUser.role==='murid') return pageMuridGrades();

  </div>`;
}
function pageMuridGrades(){
  const u=currentUser;
  const grades = db('grades').filter(g=>g.studentId===u.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const bySubj = {};
  grades.forEach(g=>{ if(!bySubj[g.subjectId]) bySubj[g.subjectId]=[]; bySubj[g.subjectId].push(g); });
  const rows = Object.keys(bySubj).map(sid=>{
    const gs = bySubj[sid];
    const avg = (gs.reduce((a,b)=>a+b.score,0)/gs.length).toFixed(1);
    return `<tr><td>${subjectName(sid)}</td><td>${gs.map(g=>`${g.type}: ${g.score}`).join(', ')}</td><td><strong>${avg}</strong></td></tr>`;

    <div style="margin-bottom:12px;display:flex;gap:8px;">

      <div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Mata Pelajaran</th><th>Jenis</th><th>Nilai</th></tr></thead><tbody>

function bindGrades(){
  const f=document.getElementById('gradeClassFilter');

function openGradeModal(studentId=null, subjectId=null){
  const students = currentUser.role==='admin'? db('users').filter(u=>u.role==='murid') : studentsInClass(window._gradeClass|| (db('classes').filter(c=>c.teacherId===currentUser.id)[0]?.id));

}
function bindLibrary(){
  const b=document.getElementById('btnAddBook');
  if(b) b.addEventListener('click', openBookModal);
  document.querySelectorAll('[data-borrow]').forEach(btn=>btn.addEventListener('click', ()=>{
    const books=db('library'); const bk=books.find(x=>x.id===btn.dataset.borrow);
    if(!bk || bk.stock-bk.borrowed<=0){toast('Stok habis','danger');return;}
    bk.borrowed += 1;
    const loans=db('loans'); loans.push({id:uid('loan'),userId:currentUser.id,bookId:bk.id,borrowedAt:new Date().toISOString(),returnedAt:null});
    dbSet('library',books); dbSet('loans',loans); renderPage(); toast('Buku dipinjam');
  }));
  document.querySelectorAll('[data-return]').forEach(btn=>btn.addEventListener('click', ()=>{
    const loans=db('loans'); const l=loans.find(x=>x.id===btn.dataset.return);
    if(l){ l.returnedAt=new Date().toISOString(); const books=db('library'); const bk=books.find(x=>x.id===l.bookId); if(bk) bk.borrowed=Math.max(0,bk.borrowed-1); dbSet('library',books); dbSet('loans',loans); renderPage(); toast('Buku dikembalikan'); }
  }));
  document.querySelectorAll('[data-del-book]').forEach(btn=>btn.addEventListener('click', ()=>{ dbSet('library', db('library').filter(b=>b.id!==btn.dataset.delBook)); renderPage(); toast('Dihapus'); }));
}
function openBookModal(){
  createModal('Tambah Buku', `

    <div class="form-group"><label>Kategori</label><input class="form-control" id="bkCat" /></div>
    <div class="form-group"><label>Stok</label><input class="form-control" type="number" id="bkStock" value="5" /></div>
  `, ()=>{
    const title=document.getElementById('bkTitle').value.trim();
    const author=document.getElementById('bkAuthor').value.trim();
    const cat=document.getElementById('bkCat').value.trim();
    const stock=parseInt(document.getElementById('bkStock').value)||1;
    if(!title){toast('Judul wajib','danger');return;}
    const books=db('library'); books.push({id:uid('bk'),title,author,category:cat,stock,borrowed:0});
    dbSet('library',books); closeModal(); renderPage(); toast('Buku ditambahkan');
  });
}

        <strong>Total Belum Lunas: ${fmtMoney(total)}</strong>

function bindPPDB(){
  const b=document.getElementById('btnPPDBForm');
  if(b) b.addEventListener('click', ()=>{ currentPage='ppdb_public'; renderApp(); });
  const s=document.getElementById('btnSubmitPPDB');
  if(s) s.addEventListener('click', submitPPDB);
  document.querySelectorAll('[data-ppdb-acc]').forEach(btn=>btn.addEventListener('click', ()=>{ updatePPDB(btn.dataset.ppdbAcc,'Diterima'); }));
  document.querySelectorAll('[data-ppdb-rej]').forEach(btn=>btn.addEventListener('click', ()=>{ updatePPDB(btn.dataset.ppdbRej,'Ditolak'); }));
}
function submitPPDB(){
  const child=document.getElementById('ppdbChild').value.trim();
  const parent=document.getElementById('ppdbParent').value.trim();
  const phone=document.getElementById('ppdbPhone').value.trim();
  const addr=document.getElementById('ppdbAddr').value.trim();
  const dob=document.getElementById('ppdbDob').value;
  const gender=document.getElementById('ppdbGender').value;
  if(!child||!parent||!phone){toast('Lengkapi data','danger');return;}

/* ---------- Calendar ---------- */
function pageCalendar(){
  const evs = db('events');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const first = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0).getDate();
  const startWeekday = first.getDay();
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day" style="background:transparent;border:none;"></div>`;
  for(let d=1; d<=lastDay; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvs = evs.filter(e=>e.date===dateStr);
    const isToday = d===now.getDate();
    cells += `<div class="cal-day ${dayEvs.length?'has-event':''} ${isToday?'today':''}">
      <div class="num">${d}</div>
      ${dayEvs.map(e=>`<div style="font-size:10px;margin-top:2px;">• ${e.title}</div>`).join('')}
    </div>`;
  }
  const evList = evs.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>`
    <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
      <div><strong>${e.title}</strong><br><span style="font-size:12px;color:var(--text-muted);">${e.description||''}</span></div>
      <span class="badge badge-info">${fmtDate(e.date)}</span>
    </div>`).join('') || '<div class="empty">Belum ada acara</div>';
  const canManage = currentUser.role==='guru'||currentUser.role==='admin';
  return `
  <div class="container fade-in">
    <div class="grid grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title">${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div>
          ${canManage?'<button class="btn btn-primary btn-sm" id="btnAddEvent">+ Acara</button>':''}
        </div>
        <div class="calendar-grid">${days.map(d=>`<div class="cal-header">${d}</div>`).join('')}${cells}</div>
      </div>
      <div class="card"><div class="card-header"><div class="card-title">Daftar Acara</div></div>${evList}</div>
    </div>
  </div>`;
}

  const btn=document.getElementById('btnAddEvent');
  if(btn) btn.addEventListener('click', openEventModal);
  document.querySelectorAll('[data-del-ev]').forEach(b=>b.addEventListener('click', ()=>{ dbSet('events', db('events').filter(x=>x.id!==b.dataset.delEv)); renderPage(); toast('Dihapus'); }));

/* ---------- Search ---------- */
function pageSearch(){
  const q = searchQuery.toLowerCase();
  const results = [];
  db('users').forEach(u=>{ if((u.name+' '+u.username).toLowerCase().includes(q)) results.push({type:'Pengguna',title:u.name,sub:u.role}); });
  db('assignments').forEach(a=>{ if(a.title.toLowerCase().includes(q)) results.push({type:'Tugas',title:a.title,sub:subjectName(a.subjectId)}); });
  db('announcements').forEach(a=>{ if(a.title.toLowerCase().includes(q)) results.push({type:'Pengumuman',title:a.title,sub:a.audience}); });
  db('materials').forEach(m=>{ if(m.title.toLowerCase().includes(q)) results.push({type:'Materi',title:m.title,sub:subjectName(m.subjectId)}); });
  if(!results.length) return `<div class="container"><div class="empty"><div class="icon">🔍</div>Tidak ada hasil untuk "${searchQuery}"</div></div>`;
  const rows = results.map(r=>`<div class="card" style="margin-bottom:8px;padding:12px;"><span class="badge badge-primary">${r.type}</span> <strong>${r.title}</strong> <span style="color:var(--text-muted);font-size:12px;">• ${r.sub}</span></div>`).join('');
  return `<div class="container fade-in"><h3 style="margin-bottom:12px;">Hasil pencarian: "${searchQuery}"</h3>${rows}</div>`;
}

/* ---------- Modal helpers ---------- */
function createModal(title, bodyHtml, onSave, saveLabel='Simpan'){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h3>${title}</h3><button class="close-btn" id="modalClose">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalCancel">Batal</button>
        <button class="btn btn-primary" id="modalSave">${saveLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', onSave);
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
}
function closeModal(){ const m=document.getElementById('modalBackdrop'); if(m) m.remove(); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Export CSV ---------- */
function exportCSV(type){
  let rows=[], filename=type+'.csv';
  if(type==='users'){ rows=[['Username','Nama','Role','Email','Telepon'], ...db('users').map(u=>[u.username,u.name,u.role,u.email,u.phone])]; }
  else if(type==='students'){ rows=[['NIS','Nama','Kelas','Email'], ...db('users').filter(u=>u.role==='murid').map(u=>[u.nis,u.name,className(u.classId),u.email])]; }
  else if(type==='grades'){ rows=[['Siswa','Mapel','Jenis','Nilai','Tanggal'], ...db('grades').map(g=>[userName(g.studentId),subjectName(g.subjectId),g.type,g.score,fmtDate(g.date)])]; }
  else if(type==='attendance'){ rows=[['Tanggal','Siswa','Status','Catatan'], ...db('attendance').map(a=>[fmtDate(a.date),userName(a.studentId),a.status,a.note])]; }
  else if(type==='payments'){ rows=[['Siswa','Tagihan','Jumlah','Jatuh Tempo','Status'], ...db('payments').map(p=>[userName(p.studentId),p.title,p.amount,fmtDate(p.dueDate),p.status])]; }
  else if(type==='ppdb'){ rows=[['Nama Anak','Ortu','Telepon','Status','Tanggal'], ...db('ppdb').map(p=>[p.childName,p.parentName,p.phone,p.status,fmtDate(p.createdAt)])]; }
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast('CSV diunduh');
}

/* ---------- bindPage ---------- */
function bindPage(){
  switch(currentPage){
    case 'settings': bindSettings(); break;
    case 'users': bindUsers(); break;
    case 'subjects': bindSubjects(); break;
    case 'classes': bindClasses(); break;
    case 'schedule': bindSchedule(); break;
    case 'exams': bindExams(); break;
    case 'attendance': bindAttendance(); break;
    case 'grades': bindGrades(); break;
    case 'report':
    case 'child_report': bindReport(); break;
    case 'assignments': bindAssignments(); break;
    case 'materials': bindMaterials(); break;
    case 'extracurriculars': bindExtracurriculars(); break;
    case 'library': bindLibrary(); break;
    case 'payments': bindPayments(); break;
    case 'ppdb':
    case 'ppdb_public': bindPPDB(); break;
    case 'announcements': bindAnnouncements(); break;
    case 'messages': bindMessages(); break;
    case 'notifications': bindNotifications(); break;
    case 'calendar': bindCalendar(); break;
    case 'gallery': bindGallery(); break;
    case 'child_attendance':
    case 'child_grades':
    case 'child_assignments': bindChildPages(); break;
  }
}
